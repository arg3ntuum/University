<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Реєстраційна форма</title>
    <style>
        input {
            width: 150px;
        }

        input:invalid {
            border-color: red;
        }

        input:valid {
            border-color: green;
        }
    </style>
</head>

<body>
    <nav>
        <a href="task1.html">Завдання 1. Реєстраційна форма.</a>
        <a href="task2.html">Завдання 2. Створіть список справ.</a>
        <a href="task3.html">Завдання 3. Перевірка вводу віку.</a>
        <a href="task4.html">Завдання 4. Інтерактивний календар.</a>
    </nav>
    <h1>Реєстраційна форма</h1>
    <p>
    <form id="registerForm" name="registerForm" method="post" action="register">
        <p>
            <label for="username">Ваше ім'я:</label><br>
            <input id="username" name="username" maxlength="20" minlength="3" required>
        </p>
        <p>
            <label for="surname">Ваше прізвище:</label><br>
            <input id="surname" name="surname" maxlength="20" minlength="3" required>
        </p>
        <p>
            <label for="email">Ваш email:</label><br>
            <input id="email" name="email" type="email" required>
        </p>
        <p>
            <label for="password">Password:</label><br>
            <input id="password" name="password" type="password" required>
        </p>
        <p>
            <label for="repeat_password">Repeat password:</label><br>
            <input id="repeat_password" name="repeat_password" type="password" required>
        </p>
        <button type="submit" id="submit" name="submit">Register</button>
    </form>
    </p>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function (event) {
            // Запобігаємо стандартній відправці форми
            event.preventDefault();

            // Отримуємо значення полів
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const repeat_password = document.getElementById('repeat_password').value;

            // Регулярний вираз для перевірки електронної пошти
            const emailRegex = /^\S+@\S+\.\S+$/;

            // Перевірка електронної пошти
            if (!emailRegex.test(email)) {
                alert('Будь ласка, введіть коректну електронну пошту.');
                return; // Зупиняємо виконання функції
            }

            // Перевірка паролів
            if (password !== repeat_password) {
                alert('Паролі не співпадають.');
                return;
            }

            // Якщо всі перевірки пройшли
            alert('Реєстрація успішна!');
            this.submit(); // Відправляємо форму
        });


    </script>
</body>

</html>
